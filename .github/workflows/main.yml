name: Module 7 - Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q main.py

      - name: Build Docker image
        run: docker build -t qr-code-generator-app .

      - name: Test Docker container
        run: |
          mkdir -p qr_codes
          docker run --rm \
            -v "${{ github.workspace }}/qr_codes:/app/qr_codes" \
            qr-code-generator-app --url https://www.njit.edu
          test -n "$(find qr_codes -name '*.png' -print -quit)"
